backend:
  name: github
  repo: kuongzn/bom_astro
  branch: main
  base_url: https://decap-one.vercel.app

local_backend: true

# 기본 전역 설정
media_folder: "public/img"
public_folder: "/bom_astro/img" # <-- 이곳에도 base 경로 추가

collections:
  - name: "pages"
    label: "페이지 콘텐츠 관리"
    files:
      - file: "content/hero-slides.json"
        label: "메인 히어로 슬라이더"
        name: "hero_slides"
        fields:
          - label: "작품 목록 (슬라이더)"
            name: "slides"
            widget: "list"
            fields:
              - {label: "작가명 (Artist)", name: "artist", widget: "string"}
              - {label: "작품명 / 타이틀 (Title)", name: "title", widget: "string"}
              - label: "작품 이미지"
                name: "img"
                widget: "image"
                media_folder: "/public/img/artworks"
                # 웹페이지에서 접근할 최종 경로에 /bom_astro 포함
                public_folder: "/bom_astro/img/artworks"

      - file: "content/exhibitions.json"
        label: "전시회 목록"
        name: "exhibitions"
        fields:
          - label: "전시회 목록"
            name: "items"
            widget: "list"
            fields:
              - {label: "시즌/태그 (예: 2026 Season)", name: "badge", widget: "string"}
              - {label: "전시 제목", name: "title", widget: "string"}
              - {label: "전시 소개 내용", name: "description", widget: "text"}
              - label: "전시 포스터 이미지"
                name: "image"
                widget: "image"
                media_folder: "/public/img/exhibitions"
                public_folder: "/bom_astro/img/exhibitions"
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Bom Gallery CMS</title>
  <style>
    /* 모바일과 PC 환경에서 CMS UI가 화면에 꽉 차도록 설정 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #nc-root {
      min-height: 100vh;
    }
    /* CMS 미리보기 내부 스타일 보정 */
    .cms-preview-container { padding: 20px; font-family: inherit; }
    .cms-preview-container img { max-width: 100%; height: auto; display: block; margin-top: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <!-- Decap CMS 루트 영역 -->
  <div id="nc-root"></div>
  
  <!-- Decap CMS 스크립트 로드 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <!-- CMS 미리보기 이미지 경로 보정을 위한 커스텀 스크립트 -->
  <script>
    // 1. 히어로 슬라이더 미리보기 컴포넌트 정의
    var HeroPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var slides = entry.getIn(['data', 'slides']);
        if (!slides) return h('div', { className: 'cms-preview-container' }, '데이터가 없습니다.');

        return h('div', { className: 'cms-preview-container' },
          h('h2', {}, '메인 히어로 슬라이더 미리보기'),
          slides.map(function(slide, index) {
            var imgPath = slide.get('img') || '';
            // Vercel CMS 환경에서 이미지를 불러올 수 있도록 깃허브 원본(raw) 주소 혹은 절대 경로로 매핑
            var fullImgUrl = imgPath.startsWith('http') ? imgPath : 'https://raw.githubusercontent.com/kuongzn/bom_astro/main/public' + imgPath;

            return h('div', { key: index, style: { marginBottom: '24px', borderBottom: '1px solid #ddd', paddingBottom: '16px' } },
              h('p', {}, h('strong', {}, '작가 (Artist): '), slide.get('artist')),
              h('p', {}, h('strong', {}, '타이틀 (Title): '), slide.get('title')),
              h('img', { src: fullImgUrl, alt: 'Artwork Preview', style: { maxHeight: '250px' } })
            );
          })
        );
      }
    });

    // 2. 전시회 목록 미리보기 컴포넌트 정의
    var ExhibitionPreview = createClass({
      render: function() {
        var entry = this.props.entry;
        var items = entry.getIn(['data', 'items']);
        if (!items) return h('div', { className: 'cms-preview-container' }, '데이터가 없습니다.');

        return h('div', { className: 'cms-preview-container' },
          h('h2', {}, '전시회 목록 미리보기'),
          items.map(function(item, index) {
            var imgPath = item.get('image') || '';
            var fullImgUrl = imgPath.startsWith('http') ? imgPath : 'https://raw.githubusercontent.com/kuongzn/bom_astro/main/public' + imgPath;

            return h('div', { key: index, style: { marginBottom: '24px', borderBottom: '1px solid #ddd', paddingBottom: '16px' } },
              h('p', {}, h('span', { style: { background: '#e5e7eb', padding: '2px 8px', borderRadius: '4px', fontSize: '12px' } }, item.get('badge'))),
              h('h3', {}, item.get('title')),
              h('p', {}, item.get('description')),
              h('img', { src: fullImgUrl, alt: 'Exhibition Preview', style: { maxHeight: '250px' } })
            );
          })
        );
      }
    });

    // 3. Decap CMS에 커스텀 미리보기 템플릿 등록 (config.yml의 collection 이름과 일치해야 함)
    CMS.registerPreviewTemplate('hero_slides', HeroPreview);
    CMS.registerPreviewTemplate('exhibitions', ExhibitionPreview);
  </script>
</body>
</html>
